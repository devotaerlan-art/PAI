<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PAT PAI Kelas X – 2025/2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: #f0f4ff; color: #1a1a2e; min-height: 100vh; }
  #cover {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3a5f 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center; color: white;
  }
  .cover-badge {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px; padding: 6px 20px; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 24px; font-weight: 500;
  }
  .cover-icon { font-size: 56px; margin-bottom: 16px; }
  .cover-title { font-size: clamp(22px,5vw,36px); font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
  .cover-subtitle { font-size: clamp(13px,3vw,16px); font-weight: 300; opacity: 0.8; margin-bottom: 32px; }
  .cover-info { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 20px 28px; margin-bottom: 36px; text-align: left; max-width: 400px; width: 100%; }
  .cover-info-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .cover-info-row:last-child { border-bottom: none; }
  .cover-info-row span:first-child { opacity: 0.7; }
  .cover-info-row span:last-child { font-weight: 600; }
  .btn-start {
    background: linear-gradient(135deg, #4fc3f7, #0288d1); color: white; border: none;
    border-radius: 50px; padding: 16px 48px; font-size: 16px; font-weight: 600;
    font-family: 'Poppins', sans-serif; cursor: pointer;
    box-shadow: 0 8px 24px rgba(2,136,209,0.4); transition: all 0.3s; letter-spacing: 0.5px;
  }
  .btn-start:hover { transform: translateY(-2px); }
  #quiz-page { display: none; min-height: 100vh; padding: 0 0 40px; }
  .quiz-header {
    background: linear-gradient(135deg, #1e3a5f, #0f3460); color: white; padding: 20px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .quiz-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .quiz-header-title { font-size: 14px; font-weight: 600; opacity: 0.9; }
  .quiz-counter { font-size: 13px; font-weight: 500; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.2); border-radius: 10px; height: 6px; }
  .progress-bar { background: #4fc3f7; height: 6px; border-radius: 10px; transition: width 0.4s ease; width: 0%; }
  .quiz-body { padding: 24px 20px; max-width: 700px; margin: 0 auto; }
  .question-card { background: white; border-radius: 20px; padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .question-num { font-size: 11px; font-weight: 600; color: #0288d1; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
  .question-category { display: inline-block; background: #e3f2fd; color: #1565c0; border-radius: 20px; padding: 3px 12px; font-size: 11px; font-weight: 500; margin-bottom: 14px; }
  .question-text { font-size: clamp(14px,3.5vw,16px); font-weight: 500; line-height: 1.7; color: #1a1a2e; margin-bottom: 6px; }
  .question-narasi { background: #f8f9ff; border-left: 3px solid #0288d1; border-radius: 0 10px 10px 0; padding: 12px 16px; font-size: 13px; line-height: 1.7; color: #444; margin-bottom: 20px; font-style: italic; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: #f8f9ff; border: 2px solid #e0e7ff; border-radius: 14px;
    padding: 14px 18px; text-align: left; font-family: 'Poppins', sans-serif;
    font-size: clamp(13px,3vw,14px); font-weight: 400; color: #1a1a2e; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: flex-start; gap: 12px; line-height: 1.5;
    -webkit-tap-highlight-color: transparent; width: 100%;
  }
  .option-btn:hover:not(:disabled) { background: #e8edff; border-color: #0288d1; transform: translateY(-1px); }
  .option-letter { min-width: 28px; height: 28px; border-radius: 50%; background: #e0e7ff; color: #1e3a5f; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .option-btn.correct { background: #e8f5e9; border-color: #43a047; color: #1b5e20; }
  .option-btn.correct .option-letter { background: #43a047; color: white; }
  .option-btn.wrong { background: #ffebee; border-color: #e53935; color: #b71c1c; }
  .option-btn.wrong .option-letter { background: #e53935; color: white; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback-box { margin-top: 16px; border-radius: 14px; padding: 16px; font-size: 13px; line-height: 1.6; display: none; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .feedback-box.correct { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
  .feedback-box.wrong { background: #fff3e0; border: 1px solid #ffcc80; color: #bf360c; }
  .feedback-icon { font-size: 18px; margin-bottom: 6px; display: block; }
  .feedback-title { font-weight: 700; margin-bottom: 4px; font-size: 14px; }
  .nav-area { display: flex; gap: 12px; justify-content: space-between; margin-top: 20px; }
  .btn-nav { flex: 1; padding: 14px; border: none; border-radius: 14px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .btn-prev { background: #e0e7ff; color: #1e3a5f; }
  .btn-prev:hover { background: #c7d2fe; }
  .btn-next { background: linear-gradient(135deg, #0288d1, #01579b); color: white; box-shadow: 0 4px 14px rgba(2,136,209,0.3); }
  .btn-next:hover { box-shadow: 0 6px 20px rgba(2,136,209,0.4); transform: translateY(-1px); }
  .dots-wrap { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; padding: 16px 20px 0; max-width: 700px; margin: 0 auto; }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: #dde4f0; border: none; font-size: 10px; font-weight: 600; font-family: 'Poppins', sans-serif; color: #666; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .dot.answered-correct { background: #43a047; color: white; }
  .dot.answered-wrong { background: #e53935; color: white; }
  .dot.current { border: 2px solid #0288d1; color: #0288d1; background: white; }
  .dot:hover { transform: scale(1.15); }
  #result-page { display: none; min-height: 100vh; background: #f0f4ff; padding: 40px 20px; }
  .result-card { background: linear-gradient(135deg, #1e3a5f, #0f3460); border-radius: 24px; padding: 40px 28px; text-align: center; color: white; max-width: 500px; margin: 0 auto 24px; box-shadow: 0 8px 30px rgba(15,52,96,0.3); }
  .result-emoji { font-size: 64px; margin-bottom: 16px; }
  .result-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .result-subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 28px; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 4px solid rgba(255,255,255,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .score-number { font-size: 36px; font-weight: 700; }
  .score-label { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
  .stat-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .stat-item { background: rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 20px; font-size: 13px; }
  .stat-item strong { font-size: 20px; display: block; }
  .btn-retry { display: block; background: linear-gradient(135deg, #4fc3f7, #0288d1); color: white; border: none; border-radius: 50px; padding: 16px 40px; font-size: 15px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(2,136,209,0.35); transition: all 0.3s; max-width: 500px; width: 100%; margin: 0 auto 24px; }
  .btn-retry:hover { transform: translateY(-2px); }
  .credit-card { background: white; border-radius: 24px; padding: 36px 28px; text-align: center; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .credit-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #90a4ae; margin-bottom: 20px; font-weight: 500; }
  .credit-photo-wrap { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; border: 4px solid #0288d1; margin: 0 auto 16px; box-shadow: 0 4px 16px rgba(2,136,209,0.3); }
  .credit-photo-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .credit-name { font-size: 20px; font-weight: 700; color: #1e3a5f; margin-bottom: 4px; }
  .credit-tagline { font-size: 13px; color: #607d8b; margin-bottom: 20px; }
  .credit-link { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #1e3a5f, #0288d1); color: white; text-decoration: none; border-radius: 50px; padding: 12px 28px; font-size: 13px; font-weight: 600; transition: all 0.3s; box-shadow: 0 4px 14px rgba(2,136,209,0.3); }
  .credit-link:hover { transform: translateY(-2px); }
  @media (max-width: 400px) { .question-card { padding: 20px 16px; } .option-btn { padding: 12px 14px; } }
</style>
</head>

      <button class="btn-nav btn-next" id="btnNext" onclick="nextQ()">Berikutnya →</button>
    </div>
  </div>
</div>
<div id="result-page"></div>

const userAnswers = new Array(questions.length).fill(null);
let current = 0;

function startQuiz() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('quiz-page').style.display = 'block';
  buildDots();
  renderQ();
  window.scrollTo(0,0);
}
function buildDots() {
  const wrap = document.getElementById('dotsWrap');
  wrap.innerHTML = '';
  questions.forEach(function(q, i) {
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = i + 1;
    d.onclick = (function(idx){ return function(){ current = idx; renderQ(); }; })(i);
    d.id = 'dot-' + i;
    wrap.appendChild(d);
  });
}
function updateDots() {
  questions.forEach(function(q, i) {
    var d = document.getElementById('dot-' + i);
    d.className = 'dot';
    if (i === current) d.classList.add('current');
    else if (userAnswers[i] !== null) {
      d.classList.add(userAnswers[i] === q.answer ? 'answered-correct' : 'answered-wrong');
    }
  });
}
function renderQ() {
  var q = questions[current];
  document.getElementById('qNum').textContent = 'Soal ' + q.num + ' dari 40';
  document.getElementById('qCat').textContent = q.cat;
  var narasiEl = document.getElementById('qNarasi');
  if (q.narasi) {
    narasiEl.style.display = 'block';
    narasiEl.textContent = q.narasi;
  } else {
    narasiEl.style.display = 'none';
  }
  document.getElementById('qText').textContent = q.text;
  var optDiv = document.getElementById('optionsDiv');
  optDiv.innerHTML = '';
  var letters = ['A','B','C','D'];
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    var ltr = document.createElement('span');
    ltr.className = 'option-letter';
    ltr.textContent = letters[i];
    var txt = document.createElement('span');
    txt.textContent = opt;
    btn.appendChild(ltr);
    btn.appendChild(txt);
    btn.onclick = (function(idx){ return function(){ selectAnswer(idx); }; })(i);
    optDiv.appendChild(btn);
  });
  var fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';
  fb.className = 'feedback-box';
  if (userAnswers[current] !== null) {
    showFeedback(userAnswers[current]);
  }
  document.getElementById('counter').textContent = (current+1) + ' / ' + questions.length;
  document.getElementById('progressBar').style.width = ((current+1)/questions.length*100) + '%';
  document.getElementById('btnNext').textContent = current === questions.length-1 ? 'Lihat Hasil' : 'Berikutnya →';
  updateDots();
  window.scrollTo({top:0, behavior:'smooth'});
}
function selectAnswer(idx) {
  if (userAnswers[current] !== null) return;
  userAnswers[current] = idx;
  showFeedback(idx);
  updateDots();
}
function showFeedback(idx) {
  var q = questions[current];
  var optBtns = document.querySelectorAll('.option-btn');
  optBtns.forEach(function(btn, i) {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === idx && idx !== q.answer) btn.classList.add('wrong');
  });
  var fb = document.getElementById('feedbackBox');
  var correct = idx === q.answer;
  fb.className = 'feedback-box ' + (correct ? 'correct' : 'wrong');
  fb.style.display = 'block';
  document.getElementById('feedIcon').textContent = correct ? '✅' : '❌';
  document.getElementById('feedTitle').textContent = correct ? 'Jawaban Benar!' : 'Jawaban Salah';
  document.getElementById('feedReason').textContent = q.reason;
}
function nextQ() {
  if (current < questions.length - 1) { current++; renderQ(); }
  else { showResult(); }
}
function prevQ() {
  if (current > 0) { current--; renderQ(); }
}
function showResult() {
  document.getElementById('quiz-page').style.display = 'none';
  var rp = document.getElementById('result-page');
  rp.style.display = 'block';
  window.scrollTo(0,0);
  var correct = 0;
  userAnswers.forEach(function(ans, i){ if (ans === questions[i].answer) correct++; });
  var wrong = questions.length - correct;
  var score = Math.round((correct / questions.length) * 100);
  var emoji = score >= 90 ? '🏆' : score >= 75 ? '⭐' : score >= 60 ? '👍' : '📚';
  var title = score >= 90 ? 'Luar Biasa!' : score >= 75 ? 'Hebat!' : score >= 60 ? 'Lumayan Bagus!' : 'Tetap Semangat!';
  var subtitle = score >= 90 ? 'Kamu menguasai materi PAI dengan sangat baik!' : score >= 75 ? 'Hampir sempurna! Pertahankan prestasimu!' : score >= 60 ? 'Masih ada ruang untuk peningkatan, terus belajar!' : 'Ayo belajar lebih giat lagi ya!';
  rp.innerHTML =
    '<div class="result-card">' +
    '<div class="result-emoji">' + emoji + '</div>' +
    '<div class="result-title">' + title + '</div>' +
    '<div class="result-subtitle">' + subtitle + '</div>' +
    '<div class="score-circle"><div class="score-number">' + score + '</div><div class="score-label">Nilai</div></div>' +
    '<div class="stat-row">' +
    '<div class="stat-item" style="color:#4caf50"><strong>' + correct + '</strong> Benar</div>' +
    '<div class="stat-item" style="color:#ef5350"><strong>' + wrong + '</strong> Salah</div>' +
    '<div class="stat-item"><strong>40</strong> Total</div>' +
    '</div></div>' +
    '<button class="btn-retry" onclick="resetQuiz()">🔄 Ulangi Ujian</button>' +
    '<div class="credit-card">' +
    '<div class="credit-label">✨ Dibuat oleh</div>' +
    '<div class="credit-photo-wrap"><img src="data:image/jpeg;base64,' + PHOTO_B64 + '" alt="Devota Erlan Sakur"></div>' +
    '<div class="credit-name">Devota Erlan Sakur</div>' +
    '<div class="credit-tagline">Pemuda Tulungagung 🌟</div>' +
    '<a class="credit-link" href="https://devoclick.online/" target="_blank" rel="noopener">🌐 devoclick.online</a>' +
    '</div>';
}
function resetQuiz() {
  userAnswers.fill(null);
  current = 0;
  document.getElementById('result-page').style.display = 'none';
  document.getElementById('quiz-page').style.display = 'block';
  buildDots();
  renderQ();
  window.scrollTo(0,0);
}
</script>
