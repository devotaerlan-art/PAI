<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kuis PAI Kelas X - Bab 6 sampai 10</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --indigo: #4f46e5;
    --yellow: #f59e0b;
    --bg: #f0f4ff;
    --card: #ffffff;
    --text: #1e1b4b;
    --sub: #6b7280;
    --border: #e0e7ff;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(79,70,229,0.10);
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* === HEADER === */
  .header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white;
    padding: 28px 20px 22px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(79,70,229,0.25);
  }
  .header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.01em; }
  .header p { font-size: 0.72rem; opacity: 0.85; margin-top: 3px; font-weight: 400; }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.25);
    border-radius: 99px;
    height: 8px;
    margin: 14px auto 0;
    max-width: 360px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: #a5f3fc;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.68rem;
    margin-top: 6px;
    opacity: 0.85;
  }

  /* === TABS === */
  .tabs-wrap {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 14px 16px 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 99px;
    border: 2px solid var(--border);
    background: white;
    font-family: 'Poppins', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--indigo);
    border-color: var(--indigo);
    color: white;
    box-shadow: 0 2px 8px rgba(79,70,229,0.25);
  }

  /* === SCORE SUMMARY === */
  .score-summary {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    justify-content: center;
  }
  .score-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 99px;
    background: white;
    border: 2px solid var(--border);
    color: var(--sub);
  }
  .score-chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .score-chip.correct { border-color: #bbf7d0; background: #f0fdf4; color: #16a34a; }
  .score-chip.correct .dot { background: var(--green); }
  .score-chip.wrong { border-color: #fecaca; background: #fef2f2; color: #dc2626; }
  .score-chip.wrong .dot { background: var(--red); }
  .score-chip.unanswered { border-color: var(--border); background: white; color: var(--sub); }
  .score-chip.unanswered .dot { background: #d1d5db; }

  /* === QUESTION CONTAINER === */
  .questions-container {
    padding: 8px 16px 100px;
    max-width: 640px;
    margin: 0 auto;
  }

  /* === QUESTION CARD === */
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    transition: transform 0.2s;
  }
  .question-card.answered-correct { border-color: #bbf7d0; }
  .question-card.answered-wrong { border-color: #fecaca; }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .q-num {
    background: var(--indigo);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 99px;
  }
  .q-bab {
    font-size: 0.65rem;
    color: var(--sub);
    font-weight: 500;
  }
  .q-status-icon {
    margin-left: auto;
    font-size: 1.1rem;
  }

  .q-text {
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 4px;
  }
  .q-ayat {
    font-family: 'Amiri', 'Scheherazade New', serif;
    font-size: 1.05rem;
    text-align: right;
    direction: rtl;
    background: #f8f7ff;
    border-left: 3px solid var(--indigo);
    padding: 10px 14px;
    border-radius: 8px;
    margin: 10px 0;
    line-height: 1.9;
    color: #312e81;
  }

  /* === OPTIONS === */
  .options-list {
    list-style: none;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option-btn {
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #f8f9ff;
    font-family: 'Poppins', sans-serif;
    font-size: 0.77rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    background: #eef2ff;
    border-color: var(--indigo);
    transform: translateX(2px);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn .opt-letter {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--sub);
    transition: all 0.18s;
  }
  .option-btn .opt-text { flex: 1; }

  .option-btn.correct-answer {
    background: #f0fdf4;
    border-color: var(--green);
    color: #15803d;
  }
  .option-btn.correct-answer .opt-letter {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .option-btn.wrong-answer {
    background: #fef2f2;
    border-color: var(--red);
    color: #b91c1c;
  }
  .option-btn.wrong-answer .opt-letter {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .option-btn.dimmed {
    opacity: 0.45;
  }

  /* === FEEDBACK === */
  .feedback-box {
    margin-top: 12px;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.75rem;
    line-height: 1.55;
    display: none;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct {
    background: #f0fdf4;
    border: 1.5px solid #bbf7d0;
    color: #166534;
  }
  .feedback-box.wrong {
    background: #fef2f2;
    border: 1.5px solid #fecaca;
    color: #991b1b;
  }
  .feedback-header {
    font-weight: 700;
    font-size: 0.82rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .feedback-penjelasan {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed rgba(0,0,0,0.12);
    color: inherit;
    opacity: 0.85;
  }
  .feedback-penjelasan strong { font-weight: 600; }

  /* === RESET BUTTON === */
  .reset-btn {
    display: block;
    margin: 0 auto 16px;
    padding: 11px 28px;
    background: var(--indigo);
    color: white;
    border: none;
    border-radius: 99px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    transition: all 0.2s;
  }
  .reset-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,0.35); }
  .reset-btn:active { transform: translateY(0); }

  /* === FINAL SCORE CARD === */
  .final-score-card {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(79,70,229,0.3);
  }
  .final-score-card h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  .final-score-big { font-size: 3rem; font-weight: 800; line-height: 1; margin: 10px 0; }
  .final-score-card p { font-size: 0.8rem; opacity: 0.85; }

  /* === EMPTY STATE === */
  .empty-tab {
    text-align: center;
    padding: 50px 20px;
    color: var(--sub);
    font-size: 0.82rem;
  }
  .empty-tab .emoji { font-size: 3rem; display: block; margin-bottom: 12px; }

  @media (max-width: 380px) {
    .header h1 { font-size: 1rem; }
    .q-text { font-size: 0.78rem; }
    .option-btn { font-size: 0.73rem; padding: 10px 12px; }
  }
</style>
</head>

// State
const userAnswers = {};
let currentBab = 'all';

function getTabs() {
  return ['all', 6, 7, 8, 9, 10];
}

function getLabel(tab) {
  if (tab === 'all') return 'Semua Bab';
  const titles = {6:'Bab 6',7:'Bab 7',8:'Bab 8',9:'Bab 9',10:'Bab 10'};
  return titles[tab];
}

function renderTabs() {
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = '';
  getTabs().forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (currentBab === tab ? ' active' : '');
    btn.textContent = getLabel(tab);
    btn.onclick = () => { currentBab = tab; renderAll(); };
    wrap.appendChild(btn);
  });
}

function getFilteredQuestions() {
  if (currentBab === 'all') return ALL_QUESTIONS;
  return ALL_QUESTIONS.filter(q => q.bab === currentBab);
}

function updateStats() {
  const total = ALL_QUESTIONS.length;
  const answered = Object.keys(userAnswers).length;
  const correct = Object.values(userAnswers).filter(v => v.correct).length;
  const wrong = answered - correct;
  const unanswered = total - answered;

  document.getElementById('progressFill').style.width = (answered / total * 100) + '%';
  document.getElementById('progressLabel').textContent = answered + ' dari ' + total + ' soal dijawab';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('unansweredCount').textContent = unanswered;
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  const filtered = getFilteredQuestions();
  container.innerHTML = '';

  // Final score card if all answered
  const allAnswered = Object.keys(userAnswers).length === ALL_QUESTIONS.length;
  if (allAnswered && currentBab === 'all') {
    const correct = Object.values(userAnswers).filter(v => v.correct).length;
    const pct = Math.round(correct / ALL_QUESTIONS.length * 100);
    const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '📚';
    const msg = pct >= 80 ? 'Mantap! Kamu siap ujian ASAS!' : pct >= 60 ? 'Lumayan, tinggal kuatkan yang salah!' : 'Yuk baca lagi materinya, kamu pasti bisa!';
    const card = document.createElement('div');
    card.className = 'final-score-card';
    card.innerHTML = `<h2>${emoji} Semua Soal Selesai!</h2>
      <div class="final-score-big">${correct}<span style="font-size:1.5rem;opacity:0.7">/${ALL_QUESTIONS.length}</span></div>
      <p style="font-size:0.9rem;font-weight:600;margin-bottom:4px">${pct}% Benar</p>
      <p>${msg}</p>`;
    container.appendChild(card);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-btn';
    resetBtn.textContent = '🔄 Ulangi Semua Soal';
    resetBtn.onclick = () => { Object.keys(userAnswers).forEach(k => delete userAnswers[k]); renderAll(); };
    container.appendChild(resetBtn);
  }

  filtered.forEach((q, idx) => {
    const globalIdx = ALL_QUESTIONS.indexOf(q);
    const answered = userAnswers[globalIdx];
    const card = document.createElement('div');
    card.className = 'question-card' + (answered ? (answered.correct ? ' answered-correct' : ' answered-wrong') : '');
    card.id = 'qcard-' + globalIdx;

    let statusIcon = '';
    if (answered) statusIcon = answered.correct ? '✅' : '❌';

    let ayatHtml = q.ayat ? `<div class="q-ayat">${q.ayat}</div>` : '';

    const letters = ['A','B','C','D','E'];
    let optionsHtml = '<ul class="options-list">';
    q.options.forEach((opt, oi) => {
      let cls = 'option-btn';
      if (answered) {
        if (oi === q.answer) cls += ' correct-answer';
        else if (answered.chosen === oi && oi !== q.answer) cls += ' wrong-answer';
        else cls += ' dimmed';
      }
      optionsHtml += `<li><button class="${cls}" ${answered ? 'disabled' : ''} onclick="handleAnswer(${globalIdx}, ${oi})">
        <span class="opt-letter">${letters[oi]}</span>
        <span class="opt-text">${opt}</span>
      </button></li>`;
    });
    optionsHtml += '</ul>';

    let feedbackHtml = '';
    if (answered) {
      const isCorrect = answered.correct;
      const feedClass = isCorrect ? 'correct' : 'wrong';
      const icon = isCorrect ? '✅' : '❌';
      const header = isCorrect ? 'Benar! Kamu berhasil!' : `Salah! Jawaban yang benar: ${letters[q.answer]}. ${q.options[q.answer]}`;
      feedbackHtml = `<div class="feedback-box ${feedClass} show">
        <div class="feedback-header">${icon} ${header}</div>
        <div class="feedback-penjelasan"><strong>💡 Penjelasan:</strong> ${q.penjelasan}</div>
      </div>`;
    }

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">No. ${globalIdx + 1}</span>
        <span class="q-bab">${q.babTitle}</span>
        <span class="q-status-icon">${statusIcon}</span>
      </div>
      <div class="q-text">${q.text}</div>
      ${ayatHtml}
      ${optionsHtml}
      ${feedbackHtml}
    `;
    container.appendChild(card);
  });
}

function handleAnswer(globalIdx, chosenIdx) {
  const q = ALL_QUESTIONS[globalIdx];
  userAnswers[globalIdx] = { chosen: chosenIdx, correct: chosenIdx === q.answer };
  updateStats();
  renderQuestions();
  // Scroll to the answered card
  setTimeout(() => {
    const el = document.getElementById('qcard-' + globalIdx);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 60);
}

function renderAll() {
  renderTabs();
  renderQuestions();
  updateStats();
}

renderAll();
</script>
</body>
</html>
